name: Refresh news data

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # fetch_news_data.py has zero external dependencies (stdlib only), so
      # no pip install step is needed here. All three categories (conflict,
      # climate, political) are fully live sources now -- nothing here needs
      # a manual re-export/conversion step anymore.
      - name: Fetch latest conflict/climate/political data
        run: python fetch_news_data.py

      - name: Commit and push if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news_data.json data/archive/
          git diff --quiet --cached || git commit -m "Auto-refresh news data"
          git push
