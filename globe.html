<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatch — the world, as it's happening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0B0F14;
    --panel: #161E28;
    --panel-line: #2B3644;
    --paper: #E8E6DE;
    --muted: #8B94A3;
    --conflict: #E2572B;
    --climate: #2FA88C;
    --political: #4C7BD9;
    --shipping: #D9A441;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; overflow: hidden; }
  body{
    font-family: 'Inter', sans-serif;
    background: var(--ink);
    color: var(--paper);
  }
  #globeViz{ position: absolute; inset: 0; }

  /* ---------- Cinematic entrance ---------- */
  @keyframes fadeInUp{
    from{ opacity: 0; transform: translateY(16px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  #vignette{
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.6) 100%);
  }

  /* ---------- Masthead ---------- */
  #masthead{
    position: absolute;
    top: 28px;
    left: 32px;
    z-index: 10;
    pointer-events: none;
    animation: fadeInUp 1100ms ease-out both;
  }
  #masthead .kicker{
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  #masthead h1{
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 46px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 0 8px;
  }
  #masthead p{
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    max-width: 34ch;
    line-height: 1.5;
  }

  /* ---------- Legend / filters ---------- */
  #legend{
    position: absolute;
    top: 32px;
    right: 32px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: fadeInUp 1100ms ease-out 220ms both;
  }
  .toggle{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border: 1px solid var(--panel-line);
    background: rgba(22, 30, 40, 0.75);
    backdrop-filter: blur(6px);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 3px;
    transition: opacity 0.15s ease;
    min-width: 140px;
  }
  .toggle.off{ opacity: 0.35; }
  .toggle .swatch{ width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .toggle .count{ margin-left: auto; color: var(--muted); font-size: 12px; }
  .toggle.conflict .swatch{ background: var(--conflict); }
  .toggle.climate .swatch{ background: var(--climate); }
  .toggle.political .swatch{ background: var(--political); }
  .toggle.lanes{ margin-top: 8px; border-color: color-mix(in srgb, var(--shipping) 40%, var(--panel-line)); }
  .toggle.lanes .swatch{ background: var(--shipping); }

  /* ---------- Story panel ---------- */
  #story-panel{
    position: absolute;
    bottom: 32px;
    left: 32px;
    z-index: 10;
    width: 360px;
    background: rgba(22, 30, 40, 0.9);
    backdrop-filter: blur(6px);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
    padding: 20px;
    transform: translateY(12px);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease;
  }
  #story-panel.visible{
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  #story-panel .story-cat{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    text-transform: lowercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  #story-panel .story-cat .swatch{ width: 7px; height: 7px; border-radius: 50%; }
  #story-panel h2{
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 20px;
    margin: 0 0 8px;
    line-height: 1.3;
  }
  #story-panel p{
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    margin: 0 0 14px;
  }
  #story-panel a{
    font-size: 13px;
    color: var(--paper);
    text-decoration: none;
    border-bottom: 1px solid var(--panel-line);
    padding-bottom: 2px;
  }
  #story-panel a:hover{ border-color: var(--paper); }
  #story-panel .close{
    position: absolute;
    top: 14px;
    right: 16px;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    background: none;
    border: none;
  }

  /* ---------- Footnote ---------- */
  #footnote{
    position: absolute;
    bottom: 28px;
    right: 32px;
    z-index: 10;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    max-width: 26ch;
    line-height: 1.5;
    animation: fadeInUp 1100ms ease-out 420ms both;
  }
</style>
</head>
<body>

<div id="globeViz"></div>
<div id="vignette"></div>

<div id="masthead">
  <span class="kicker">Conflict &middot; Climate &middot; Political</span>
  <h1>Dispatch</h1>
  <p>Geolocated in real time. Rotate, zoom, click any point.</p>
</div>

<div id="legend">
  <button class="toggle conflict" data-category="conflict"><span class="swatch"></span> Conflict <span class="count"></span></button>
  <button class="toggle climate" data-category="climate"><span class="swatch"></span> Climate <span class="count"></span></button>
  <button class="toggle political" data-category="political"><span class="swatch"></span> Political <span class="count"></span></button>
  <button class="toggle lanes off" id="lanes-toggle"><span class="swatch"></span> Shipping Lanes</button>
</div>

<div id="story-panel">
  <button class="close" onclick="hidePanel()">&times;</button>
  <div class="story-cat"><span class="swatch"></span><span id="panel-cat"></span></div>
  <h2 id="panel-place"></h2>
  <p id="panel-headline"></p>
  <a id="panel-link" href="#" target="_blank">Read the source →</a>
</div>

<div id="footnote">This is a concept mockup with sample events — not live data.</div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
<script>
  const COLORS = {
    conflict: '#E2572B',
    climate: '#2FA88C',
    political: '#4C7BD9',
  };

  // Approximate centroids, used only to label continents on the globe.
  const CONTINENT_LABELS = [
    { name: 'NORTH AMERICA', lat: 45, lng: -100 },
    { name: 'SOUTH AMERICA', lat: -15, lng: -60 },
    { name: 'EUROPE', lat: 50, lng: 15 },
    { name: 'AFRICA', lat: 2, lng: 20 },
    { name: 'ASIA', lat: 48, lng: 90 },
    { name: 'OCEANIA', lat: -25, lng: 135 },
  ];

  const DATA_URL = 'data/news_data.json'; // written by fetch_news_data.py

  // Used only if news_data.json isn't found yet (e.g. you haven't run the
  // fetch script, or it's still fetching for the first time).
  const SAMPLE_EVENTS = [
    { category: 'conflict', lat: 50.45, lng: 30.52, place: 'Kyiv, Ukraine', headline: 'Overnight strikes reported near the capital as air defenses respond.', size: 0.9, url: 'https://example.com' },
    { category: 'conflict', lat: 31.5, lng: 34.47, place: 'Gaza Strip', headline: 'Ceasefire talks resume in Cairo amid renewed clashes along the border.', size: 1.1, url: 'https://example.com' },
    { category: 'conflict', lat: 15.55, lng: 32.56, place: 'Khartoum, Sudan', headline: 'Fighting displaces thousands from the capital region overnight.', size: 0.8, url: 'https://example.com' },
    { category: 'conflict', lat: 34.56, lng: 69.21, place: 'Kabul, Afghanistan', headline: 'Security forces respond to an attack near a government building.', size: 0.6, url: 'https://example.com' },
    { category: 'conflict', lat: 6.52, lng: 3.38, place: 'Lagos, Nigeria', headline: 'Protests over fuel prices turn tense in the city center.', size: 0.5, url: 'https://example.com' },

    { category: 'climate', lat: 37.98, lng: 23.73, place: 'Athens, Greece', headline: 'Heatwave pushes temperatures past 44°C, straining the power grid.', size: 0.7, url: 'https://example.com' },
    { category: 'climate', lat: 23.81, lng: 90.41, place: 'Dhaka, Bangladesh', headline: 'Monsoon flooding displaces coastal villages for a second week.', size: 0.9, url: 'https://example.com' },
    { category: 'climate', lat: 39.74, lng: -104.99, place: 'Denver, USA', headline: 'Wildfire smoke triggers air quality alerts across the region.', size: 0.6, url: 'https://example.com' },
    { category: 'climate', lat: -33.87, lng: 151.21, place: 'Sydney, Australia', headline: 'Coastal flooding warnings issued as king tides approach.', size: 0.5, url: 'https://example.com' },
    { category: 'climate', lat: 28.61, lng: 77.21, place: 'New Delhi, India', headline: 'Drought conditions strain water supply for millions.', size: 0.7, url: 'https://example.com' },

    { category: 'political', lat: 38.9, lng: -77.04, place: 'Washington, D.C.', headline: 'Lawmakers spar over the next budget bill ahead of a shutdown deadline.', size: 0.8, url: 'https://example.com' },
    { category: 'political', lat: 51.5, lng: -0.13, place: 'London, UK', headline: 'Cabinet reshuffle announced following a narrow confidence vote.', size: 0.6, url: 'https://example.com' },
    { category: 'political', lat: -15.79, lng: -47.88, place: 'Brasília, Brazil', headline: 'Supreme court ruling reshapes the electoral calendar.', size: 0.5, url: 'https://example.com' },
    { category: 'political', lat: 35.68, lng: 139.65, place: 'Tokyo, Japan', headline: 'Ruling coalition faces internal pressure over coalition terms.', size: 0.5, url: 'https://example.com' },
    { category: 'political', lat: 28.61, lng: 77.21, place: 'New Delhi, India', headline: 'Opposition parties form a new alliance ahead of state elections.', size: 0.6, url: 'https://example.com' },
  ];

  // Live data starts empty; loadData() fills it once the fetch resolves.
  let EVENTS = [];

  const activeCategories = new Set(['conflict', 'climate', 'political']);

  function updateCounts() {
    ['conflict', 'climate', 'political'].forEach(cat => {
      const n = EVENTS.filter(e => e.category === cat).length;
      const el = document.querySelector(`.toggle.${cat} .count`);
      if (el) el.textContent = n;
    });
  }

  function visibleData() {
    return EVENTS.filter(e => activeCategories.has(e.category));
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.replace('#', ''), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  // fetch_news_data.py writes {category, lat, lon, name, count, html} --
  // this maps that shape into what the globe expects, and pulls a headline
  // + link out of GDELT's raw html snippet.
  function transformFeature(f) {
    let headline = '';
    let url = '#';
    try {
      const doc = new DOMParser().parseFromString(f.html || '', 'text/html');
      const links = doc.querySelectorAll('a');
      if (links.length > 0) {
        headline = links[0].textContent.trim();
        url = links[0].getAttribute('href') || '#';
        if (links.length > 1) {
          const more = links.length - 1;
          headline += ` (+${more} more ${more === 1 ? 'story' : 'stories'})`;
        }
      }
    } catch (e) { /* fall through to plain-text fallback below */ }

    if (!headline) {
      headline = (f.html || '').replace(/<[^>]+>/g, '').trim() || 'No headline available';
    }

    const count = f.count || 1;
    const size = Math.max(0.3, Math.min(1.3, 0.3 + Math.log2(count + 1) * 0.25));

    return {
      category: f.category,
      lat: f.lat,
      lng: f.lon,
      place: f.name,
      headline,
      url,
      size,
    };
  }

  // If the globe.gl library failed to load (blocked script, no internet,
  // ad-blocker, etc.) show a visible message instead of a silent blank page.
  if (typeof Globe === 'undefined') {
    document.getElementById('globeViz').innerHTML =
      '<div style="color:#E8E6DE;font-family:Inter,sans-serif;padding:40px;max-width:480px;line-height:1.6;">' +
      '<h2 style="font-family:Newsreader,serif;font-weight:500;">Couldn\'t load the globe library</h2>' +
      '<p>This page loads globe.gl from a CDN (cdn.jsdelivr.net). If you\'re offline, on a restricted network, ' +
      'or have an ad-blocker/script-blocker enabled, that request can get blocked. Try: checking your internet connection, ' +
      'disabling ad-blockers for this page, or opening it in a different browser.</p></div>';
    throw new Error('globe.gl failed to load from CDN');
  }

  const world = Globe()
    (document.getElementById('globeViz'))
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
    .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .backgroundColor('rgba(0,0,0,0)')
    .showAtmosphere(true)
    .atmosphereColor('#4C7BD9')
    .atmosphereAltitude(0.18)
    .pointsData([])
    .pointLat('lat')
    .pointLng('lng')
    .pointColor(d => COLORS[d.category])
    .pointAltitude(0.01)
    .pointRadius(d => 0.35 + d.size * 0.5)
    .pointLabel(d => `<div style="font-family:Inter,sans-serif;font-size:12px;padding:4px 2px;">${d.place}</div>`)
    .onPointClick(showPanel)
    .ringsData([])
    .ringColor(d => {
      const [r, g, b] = hexToRgb(COLORS[d.category]);
      return t => `rgba(${r}, ${g}, ${b}, ${Math.sqrt(1 - t)})`;
    })
    .ringMaxRadius(d => 3 + d.size * 2.5)
    .ringPropagationSpeed(0.9)
    .ringRepeatPeriod(2400)
    .labelsData(CONTINENT_LABELS)
    .labelLat('lat')
    .labelLng('lng')
    .labelText('name')
    .labelSize(1.5)
    .labelDotRadius(0)
    .labelColor(() => 'rgba(232, 230, 222, 0.45)')
    .labelResolution(2)
    .labelAltitude(0.005)
    .pathsData([])
    .pathPoints(d => d.path)
    .pathPointLat(p => p[0])
    .pathPointLng(p => p[1])
    .pathColor(d => LANE_STYLE[d.volume]?.color || LANE_STYLE.medium.color)
    .pathStroke(d => LANE_STYLE[d.volume]?.stroke || LANE_STYLE.medium.stroke)
    .pathLabel(d => `<div style="font-family:Inter,sans-serif;font-size:12px;max-width:220px;padding:4px 2px;"><strong>${d.name}</strong><br>${d.note}</div>`)
    .pathTransitionDuration(0);

  // Cinematic entrance: start pulled back, then glide in to the resting view.
  // Flood the whole sphere with light so there's no dark/night side --
  // globe.gl's default directional light otherwise leaves half the globe in
  // shadow. Tune the lights it already created internally (rather than
  // constructing new THREE.Light instances, which needs a separate THREE.js
  // import that conflicts with globe.gl's own bundled copy).
  world.scene().traverse(obj => {
    if (obj.isAmbientLight) obj.intensity = 2.4;
    if (obj.isDirectionalLight) obj.intensity = 0.3;
  });

  world.pointOfView({ lat: 15, lng: 20, altitude: 3.5 });
  setTimeout(() => {
    world.pointOfView({ lat: 15, lng: 20, altitude: 2.4 }, 3200);
  }, 200);

  const controls = world.controls();
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;
  controls.enableZoom = true;

  function showPanel(d) {
    document.getElementById('panel-cat').textContent = d.category;
    document.querySelector('#story-panel .story-cat .swatch').style.background = COLORS[d.category];
    document.getElementById('panel-place').textContent = d.place;
    document.getElementById('panel-headline').textContent = d.headline;
    document.getElementById('panel-link').href = d.url;
    document.getElementById('story-panel').classList.add('visible');
    controls.autoRotate = false;
    world.pointOfView({ lat: d.lat, lng: d.lng, altitude: 1.6 }, 800);
  }

  function hidePanel() {
    document.getElementById('story-panel').classList.remove('visible');
    controls.autoRotate = true;
  }

  const LANE_STYLE = {
    'very-high': { color: 'rgba(217, 164, 65, 0.9)', stroke: 1.1 },
    'high': { color: 'rgba(217, 164, 65, 0.7)', stroke: 0.75 },
    'medium': { color: 'rgba(217, 164, 65, 0.5)', stroke: 0.45 },
  };

  let LANES = [];
  let lanesVisible = false;

  async function loadLanes() {
    try {
      const res = await fetch('data/shipping_lanes.json');
      if (!res.ok) return;
      const data = await res.json();
      LANES = data.lanes || [];
    } catch (e) { /* lanes are optional -- fail silently */ }
  }
  loadLanes();

  document.getElementById('lanes-toggle').addEventListener('click', (e) => {
    lanesVisible = !lanesVisible;
    e.currentTarget.classList.toggle('off', !lanesVisible);
    world.pathsData(lanesVisible ? LANES : []);
  });

  document.querySelectorAll('.toggle[data-category]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.dataset.category;
      if (activeCategories.has(cat)) {
        activeCategories.delete(cat);
        btn.classList.add('off');
      } else {
        activeCategories.add(cat);
        btn.classList.remove('off');
      }
      world.pointsData(visibleData());
      world.ringsData(visibleData().filter(d => d.size > 0.7));
    });
  });

  function refreshGlobe() {
    updateCounts();
    world.pointsData(visibleData());
    world.ringsData(visibleData().filter(d => d.size > 0.7));
  }

  function setFootnote(text) {
    const el = document.getElementById('footnote');
    if (el) el.textContent = text;
  }

  async function loadData() {
    try {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const features = (data.features || []).filter(f => typeof f.lat === 'number' && typeof f.lon === 'number');

      if (features.length === 0) throw new Error('news_data.json had no usable features');

      EVENTS = features.map(transformFeature);
      const when = new Date(data.generated_at);
      setFootnote(
        `Live data — ${EVENTS.length} locations` +
        (isNaN(when) ? '' : `, refreshed ${when.toLocaleString()}`)
      );
    } catch (err) {
      EVENTS = SAMPLE_EVENTS;
      setFootnote('Showing sample data — run fetch_news_data.py to load real events.');
    }
    refreshGlobe();
  }

  loadData();

  window.addEventListener('resize', () => {
    world.width(window.innerWidth);
    world.height(window.innerHeight);
  });
</script>

</body>
</html>
